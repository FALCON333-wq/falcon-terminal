name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from branch main folder root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/pages.json << 'EOF'
          {"build_type":"legacy","source":{"branch":"main","path":"/"}}
          EOF
          set +e
          resp=$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/pages" \
            --input /tmp/pages.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$resp"
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$resp" | grep -Eq 'already exists|409' && exit 0
            exit "$status"
          fi
